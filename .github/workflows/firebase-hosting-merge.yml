# Auto-deploy: Firebase Hosting + Cloud Functions on push to main
name: Deploy to Firebase on merge
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Build frontend ──
      - run: npm ci && npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

      # ── Deploy Hosting ──
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SERASAN_WEB }}'
          channelId: live
          projectId: serasan-web
          target: manager

      # ── Deploy Cloud Functions ──
      - name: Install functions dependencies
        run: cd functions && npm ci

      - name: Create functions .env
        run: |
          echo "GMAIL_USER=${{ secrets.GMAIL_USER }}" > functions/.env
          echo "GMAIL_APP_PASS=${{ secrets.GMAIL_APP_PASS }}" >> functions/.env

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Cloud Functions
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SERASAN_WEB }}' > /tmp/sa-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json
          firebase deploy --only functions --project serasan-web --force
          rm /tmp/sa-key.json

      - name: Deploy Firestore rules
        continue-on-error: true
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SERASAN_WEB }}' > /tmp/sa-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json
          firebase deploy --only firestore:rules --project serasan-web --force || \
            echo "⚠️ Firestore rules deploy failed (403 – service account lacks Firebase Rules Admin role). Deploy rules manually via Firebase console."
          rm /tmp/sa-key.json
